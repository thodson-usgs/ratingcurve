name: ratingcurve
channels:
  - conda-forge
dependencies:
  # Keep in sync with the dependencies in pyproject.toml.
  # pymc 5.28.1 is the first release to cap arviz<1.0; earlier releases
  # resolve to arviz 1.x, which pymc 5 cannot import.
  - pymc>=5.28.1
  - arviz
  - matplotlib
  - netcdf4
  - numpy
  - pandas
  - patsy
  - pytensor
  - xarray
