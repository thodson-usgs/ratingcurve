# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      # the pin lives in pyproject.toml's lint group. Installing the group
      # rather than an extra keeps the package, and so pymc and the rest of
      # the stack, out of a job that only runs a standalone binary.
      run: |
        python -m pip install --upgrade pip
        pip install --group lint
    - name: Lint with ruff
      # rules live in [tool.ruff] in pyproject.toml
      run: ruff check . --output-format=github

  build:

    name: python ${{ matrix.python-version }}, pymc ${{ matrix.pymc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ratingcurve supports PyMC 5 (ArviZ 0.x) and PyMC 6 (ArviZ 1.x),
        # which use different inference data APIs, so cover both at each end
        # of the supported Python range rather than every combination. PyMC 6
        # requires Python >= 3.12, so the floor is PyMC 5 only.
        include:
          - {python-version: "3.11", pymc-version: "5"}
          - {python-version: "3.12", pymc-version: "6"}
          - {python-version: "3.14", pymc-version: "5"}
          - {python-version: "3.14", pymc-version: "6"}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # install the package itself, so that its declared dependencies are
        # exercised rather than assumed
        pip install -e ".[test]" "pymc==${{ matrix.pymc-version }}.*"
    - name: Report installed versions
      run: |
        python -c "import pymc, arviz; print('pymc', pymc.__version__, '| arviz', arviz.__version__)"
    - name: Test with pytest
      run: |
        pytest
